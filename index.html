<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดรายรับรายจ่าย</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="รายรับรายจ่าย"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#fff6ea" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1d1612" media="(prefers-color-scheme: dark)">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Mitr:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6ea;--card:#fffdf9;--ink:#3b2a20;--mute:#8a7566;--line:#f1e1cf;--in:#2a9d74;--out:#e5484d;--warn:#f5a524;--pri:#ffa14f;--onpri:#3b2a20;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1612;--card:#2a211b;--ink:#f7ecdf;--mute:#b3a090;--line:#3f322a;--in:#4fd1a1;--out:#ff7a7f;--pri:#ffa14f;--onpri:#3b2a20}}
:root[data-theme="dark"]{--bg:#1d1612;--card:#2a211b;--ink:#f7ecdf;--mute:#b3a090;--line:#3f322a;--in:#4fd1a1;--out:#ff7a7f;--pri:#ffa14f;--onpri:#3b2a20}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:15px}
#app{max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;padding:16px 16px calc(130px + env(safe-area-inset-bottom,0px))}
h1{font-size:15px;font-weight:500;color:var(--mute);margin:4px 0 2px}
.bal{font-size:40px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.row2{display:flex;gap:10px;margin:14px 0}
.pill{flex:1;background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--line)}
.pill b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.pill span{color:var(--mute);font-size:13px}
.in{color:var(--in)}.out{color:var(--out)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
h2{font-size:16px;margin:18px 0 8px}
input,select,button{font:inherit;color:inherit}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.tx .m{flex:1;min-width:0}.tx .m div:first-child{font-weight:500}
.tx .m small{color:var(--mute)}
.amt{font-weight:600;font-variant-numeric:tabular-nums}
.del{background:none;border:0;color:var(--mute);font-size:18px;padding:4px 6px;cursor:pointer}
.empty{color:var(--mute);text-align:center;padding:24px 0}
nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;padding:6px;color:var(--mute);font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .e{font-size:20px}
nav button.on{color:var(--ink);font-weight:600}
.fab{position:absolute;right:18px;bottom:calc(98px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--pri);color:var(--onpri);font-size:30px;cursor:pointer;box-shadow:0 6px 18px rgba(20,33,61,.3)}
.sheet-bg{position:absolute;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button.on.i{color:var(--in)}.seg button.on.o{color:var(--out)}
.big{width:100%;font-size:32px;font-weight:700;border:0;border-bottom:2px solid var(--line);background:none;padding:6px 0;margin-bottom:12px;outline:none;font-variant-numeric:tabular-nums}
.big:focus{border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:none;border-radius:20px;padding:7px 12px;cursor:pointer}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.fld{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin-bottom:10px}
.save{width:100%;padding:14px;border:0;border-radius:14px;background:var(--pri);color:var(--onpri);font-weight:600;cursor:pointer;margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:6px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .p{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars i{display:block;width:40%;border-radius:4px 4px 0 0;min-height:2px}
.bars small{color:var(--mute);font-size:12px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:8px}
.leg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.donut{display:flex;align-items:center;gap:16px}
.lg div{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.lg b{width:10px;height:10px;border-radius:3px;flex:none}
.bud{margin:14px 0}
.bud .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bud input{width:96px;text-align:right;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.track{height:8px;border-radius:6px;background:var(--bg);margin:8px 0 4px;overflow:hidden}
.track i{display:block;height:100%;border-radius:6px}
.note{font-size:13px;color:var(--mute)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--pri);color:var(--onpri);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.mnav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;cursor:pointer}.mnav button:disabled{opacity:.3;cursor:default}.mnav span{font-weight:600;font-size:16px}
.dh{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;padding:12px 0 2px;font-variant-numeric:tabular-nums}
.rowbtn{display:flex;flex:1;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:0;cursor:pointer;min-width:0;color:inherit;font:inherit}
.btn{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:500;cursor:pointer;margin:6px 0}.btn.p{background:var(--pri);color:var(--onpri);border:0}textarea.fld{min-height:90px;resize:vertical}.chk{display:flex;align-items:center;gap:8px;margin:2px 0 10px;color:var(--mute);font-size:14px}.banner{border-color:var(--warn)}.sr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.sr:last-child{border:0}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}input,select,textarea{font-size:16px}
.hero{background:linear-gradient(135deg,#ffcf94,#ffa14f);color:#3b2a20;border-radius:22px;padding:16px 20px;margin:8px 0}.hero h1{color:#3b2a20;opacity:.8;margin:0}.hero .bal{color:#3b2a20}
.bal,h2,.mnav span{font-family:"Mitr","IBM Plex Sans Thai",sans-serif;font-weight:500}
.mas{display:flex;align-items:center;gap:10px;margin:4px 0}.bub{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:14px}
.cr{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.cr:last-child{border:0}.cr .m{flex:1;min-width:0}.cr .t{display:flex;justify-content:space-between}
.card,.pill{border-radius:20px}.fab{border-radius:50%}nav button.on .e{transform:scale(1.18)}
</style>
</head>
<body>
<div id="app"><main id="main"></main><button class="fab" id="fab" aria-label="เพิ่มรายการ">+</button>
<nav id="nav"></nav><div id="layer"></div></div>
<script>
var CATS={food:['อาหาร','🍜','#e5484d'],trans:['เดินทาง','🚌','#3b82f6'],home:['ที่พัก','🏠','#8b5cf6'],shop:['ช้อปปิ้ง','🛍','#f5a524'],fun:['บันเทิง','🎬','#ec4899'],other:['อื่น ๆ','📦','#64748b'],salary:['เงินเดือน','💼','#0f9d76'],extra:['รายได้เสริม','✨','#14b8a6']};
var OUTC=['food','trans','home','shop','fun','other'],INC=['salary','extra'],BO=OUTC.slice(),BI=INC.slice();
var KEY='expense-app-v1';
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function seed(){var t=[],n=new Date(),id=1;
for(var m=0;m<6;m++){var b=new Date(n.getFullYear(),n.getMonth()-m,1);
function a(d,ty,amt,c,nt){t.push({id:id++,type:ty,amt:amt,cat:c,note:nt,date:ds(new Date(b.getFullYear(),b.getMonth(),d))})}
a(1,'in',28000+m*300,'salary','เงินเดือน');
if(m%2==0)a(12,'in',3500,'extra','งานเสริม');
a(2,'out',7500,'home','ค่าเช่าห้อง');
a(3,'out',180+m*12,'food','ข้าวมันไก่');
a(5,'out',650,'trans','เติมน้ำมัน');
a(8,'out',2400-m*150,'shop','ซื้อเสื้อผ้า');
a(10,'out',1200+m*80,'food','กินข้าวกับเพื่อน');
a(15,'out',420,'fun','ดูหนัง');
a(18,'out',850,'food','ซื้อของเข้าบ้าน');
a(20,'out',300,'other','ค่าโทรศัพท์')}
return t}
var S={tx:[],custom:[],rec:[],gen:{},last:0,map:{},bud:{food:5000,trans:1500,home:7500,shop:2000,fun:1000,other:800},tab:'home',q:'',sheet:false,type:'out',cat:'food'};
try{var r=localStorage.getItem(KEY);if(r)apply(JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({tx:S.tx,bud:S.bud,custom:S.custom,rec:S.rec,gen:S.gen,last:S.last,map:S.map}))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return Math.round(n).toLocaleString('th-TH')}
var MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function ym(d){return d.slice(0,7)}
var NOW=new Date(),TODAY=ds(NOW).slice(0,7),CUR=TODAY;
function sum(list,ty){return list.filter(function(x){return x.type==ty}).reduce(function(s,x){return s+x.amt},0)}
function monthTx(){return S.tx.filter(function(x){return ym(x.date)==CUR})}
function txRow(x){var c=CATS[x.cat],d=x.date.split('-');
return '<div class="tx"><button class="rowbtn" data-edit="'+x.id+'"><div class="ic" style="background:'+c[2]+'22">'+c[1]+'</div><div class="m"><div>'+esc(x.note||c[0])+'</div><small>'+c[0]+'</small></div><div class="amt '+(x.type=='in'?'in':'out')+'">'+(x.type=='in'?'+':'−')+money(x.amt)+'</div></button><button class="del" data-del="'+x.id+'" aria-label="ลบ">×</button></div>'}
function mbar(){var p=CUR.split('-');return '<div class="mnav"><button data-mv="-1" aria-label="เดือนก่อน">‹</button><span>'+MON[+p[1]-1]+' '+(+p[0]+543)+'</span><button data-mv="1" aria-label="เดือนถัดไป"'+(CUR>=TODAY?' disabled':'')+'>›</button></div>'}
function grouped(l){var h='',last='',tot={};l.forEach(function(x){tot[x.date]=(tot[x.date]||0)+(x.type=='in'?x.amt:-x.amt)});l.forEach(function(x){if(x.date!=last){last=x.date;var d=x.date.split('-'),n=tot[x.date];h+='<div class="dh"><span>'+(+d[2])+' '+MON[+d[1]-1]+'</span><span>'+(n>=0?'+':'−')+money(Math.abs(n))+'</span></div>'}h+=txRow(x)});return h}
function insight(i,o){if(!i&&!o)return '';var r=i?(i-o)/i:-1,pc=Math.round(r*100),w=Math.max(0,Math.min(100,r/.2*100)),col=r<0?'var(--out)':r>=.2?'var(--in)':'var(--warn)';var t=r<0?'⚠️ รายจ่ายเกินรายรับในเดือนนี้':r>=.2?'🌱 ออมได้ '+pc+'% ของรายรับ ถึงเป้า 20% แล้ว':'ออมได้ '+pc+'% ของรายรับ เป้าหมายคือ 20%';return '<div class="card"><div>'+t+'</div><div class="track"><i style="width:'+w+'%;background:'+col+'"></i></div></div>'}
function tip(ks,by,tot){if(!tot)return '';var p=CUR.split('-'),dm=CUR==TODAY?NOW.getDate():new Date(+p[0],+p[1],0).getDate();return '<div class="card note">💡 จ่ายมากสุดคือ'+CATS[ks[0]][0]+' '+Math.round(by[ks[0]]/tot*100)+'% ของรายจ่าย · เฉลี่ยวันละ '+money(tot/dm)+' บาท</div>'}
function home(){var m=monthTx(),i=sum(m,'in'),o=sum(m,'out');
var list=S.tx.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
var q=S.q.trim();if(q)list=list.filter(function(x){return (x.note+CATS[x.cat][0]).indexOf(q)>-1});
list=q?list.slice(0,100):list.filter(function(x){return ym(x.date)==CUR});
return banner()+mbar()+mascot()+'<div class="hero"><h1>คงเหลือเดือนนี้</h1><div class="bal">฿'+money(i-o)+'</div></div><div class="row2"><div class="pill"><span>รายรับ</span><b class="in">+'+money(i)+'</b></div><div class="pill"><span>รายจ่าย</span><b class="out">−'+money(o)+'</b></div></div>'+
insight(i,o)+'<button class="btn" data-bulk="1">📥 นำเข้าสลิปหลายใบ</button><input type="file" id="bulk" accept="image/*" multiple hidden><input class="search" id="q" placeholder="ค้นหารายการหรือหมวดหมู่" value="'+esc(S.q)+'">'+viewseg(q)+'<div class="card" style="padding:4px 14px">'+(S.view=='month'&&!q?catlist(m,o):list.length?grouped(list):'<div class="empty">ยังไม่มีรายการ แตะ + เพื่อเพิ่มรายการแรก</div>')+'</div>'}
function stats(){var m=monthTx().filter(function(x){return x.type=='out'}),tot=sum(m,'out'),by={};
m.forEach(function(x){by[x.cat]=(by[x.cat]||0)+x.amt});
var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]}),R=44,C=2*Math.PI*R,off=0,arcs='';
ks.forEach(function(k){var l=by[k]/tot*C;arcs+='<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+CATS[k][2]+'" stroke-width="16" stroke-dasharray="'+l+' '+(C-l)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 60 60)"/>';off+=l});
var donut=tot?'<div class="donut"><svg width="130" height="130" viewBox="0 0 120 120">'+arcs+'<text x="60" y="58" text-anchor="middle" font-size="9" fill="var(--mute)">จ่ายรวม</text><text x="60" y="73" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">'+money(tot)+'</text></svg><div class="lg">'+ks.map(function(k){return '<div><b style="background:'+CATS[k][2]+'"></b>'+CATS[k][0]+' '+Math.round(by[k]/tot*100)+'%</div>'}).join('')+'</div></div>':'<div class="empty">เดือนนี้ยังไม่มีรายจ่าย</div>';
var months=[],mx=1;for(var k=5;k>=0;k--){var cp=CUR.split('-'),d=new Date(+cp[0],+cp[1]-1-k,1),key=ds(d).slice(0,7),l=S.tx.filter(function(x){return ym(x.date)==key}),a=sum(l,'in'),b=sum(l,'out');mx=Math.max(mx,a,b);months.push([MON[d.getMonth()],a,b])}
var bars='<div class="bars">'+months.map(function(x){return '<div class="c"><div class="p"><i style="height:'+(x[1]/mx*100)+'%;background:var(--in)"></i><i style="height:'+(x[2]/mx*100)+'%;background:var(--out)"></i></div><small>'+x[0]+'</small></div>'}).join('')+'</div><div class="leg"><span><b style="background:var(--in)"></b>รายรับ</span><span><b style="background:var(--out)"></b>รายจ่าย</span></div>';
return mbar()+'<h2 style="margin-top:4px">รายจ่ายตามหมวด</h2><div class="card">'+donut+'</div>'+tip(ks,by,tot)+'<h2>รายรับ-รายจ่าย 6 เดือน</h2><div class="card">'+bars+'</div>'}
function budget(){var m=monthTx(),by={};m.filter(function(x){return x.type=='out'}).forEach(function(x){by[x.cat]=(by[x.cat]||0)+x.amt});
var over=[];
var rows=OUTC.map(function(k){var b=S.bud[k]||0,u=by[k]||0,p=b?u/b:0,col=p>=1?'var(--out)':p>=.8?'var(--warn)':'var(--in)';if(p>=.8)over.push(CATS[k][0]+(p>=1?' เกินงบแล้ว':' ใกล้เกินงบ'));
return '<div class="bud"><div class="h"><span>'+CATS[k][1]+' '+CATS[k][0]+'</span><input type="number" inputmode="numeric" data-bud="'+k+'" value="'+b+'" aria-label="งบ'+CATS[k][0]+'"></div><div class="track"><i style="width:'+Math.min(100,p*100)+'%;background:'+col+'"></i></div><div class="note">ใช้ไป '+money(u)+' จาก '+money(b)+' บาท'+(b?' ('+Math.round(p*100)+'%)':'')+'</div></div>'}).join('');
return mbar()+'<h2 style="margin-top:4px">งบประมาณ</h2>'+(over.length?'<div class="card" style="border-color:var(--warn)">⚠️ '+over.join(' · ')+'</div>':'')+'<div class="card">'+rows+'</div><div class="note">แก้ตัวเลขช่องขวาเพื่อตั้งงบใหม่ แถบจะเปลี่ยนเป็นสีส้มเมื่อใช้ถึง 80% และสีแดงเมื่อเกินงบ</div>'}
var PAL=['#0ea5e9','#d946ef','#84cc16','#f97316','#06b6d4','#a855f7','#eab308'];
function regCats(){OUTC=BO.slice();INC=BI.slice();S.custom.forEach(function(c,i){CATS[c.id]=[c.name,c.emoji,PAL[i%PAL.length]];(c.type=='in'?INC:OUTC).push(c.id)})}
function apply(p){if(!p||!Array.isArray(p.tx))return false;S.tx=p.tx;S.bud=p.bud||S.bud;S.custom=p.custom||[];S.rec=p.rec||[];S.gen=p.gen||{};S.last=p.last||0;S.map=p.map||{};regCats();return true}
function nx(m){var p=m.split('-');return ds(new Date(+p[0],+p[1],1)).slice(0,7)}
function nid(){return S.tx.reduce(function(a,x){return Math.max(a,x.id)},0)+1}
function runRec(){var t=ds(NOW),ch=false;S.rec.forEach(function(r){var m=S.gen[r.id]?nx(S.gen[r.id]):r.start;while(m<=TODAY){var p=m.split('-'),dm=new Date(+p[0],+p[1],0).getDate(),d=m+'-'+String(Math.min(r.day,dm)).padStart(2,'0');if(d>t)break;S.tx.push({id:nid(),type:r.type,amt:r.amt,cat:r.cat,note:r.note,date:d,rec:r.id});S.gen[r.id]=m;ch=true;m=nx(m)}});if(ch)save()}
function bk(){return JSON.stringify({v:1,tx:S.tx,bud:S.bud,custom:S.custom,rec:S.rec,gen:S.gen,map:S.map})}
function done(){S.last=Date.now();save();render()}

function parseSlip(t){
var L=t.split('\n').map(function(x){return x.replace(/\s+/g,' ').trim()}).filter(Boolean),o={};
var rf=t.match(/รหัสอ้างอิง[:\s]*([0-9]{10,})/);if(rf)o.ref=rf[1];
for(var i=0;i<L.length;i++){if(/ธรรมเนียม|fee/i.test(L[i]))continue;var m=L[i].match(/^฿?\s*([0-9][0-9,]*\.[0-9]{2})\s*(บาท)?$/);if(m){o.amt=parseFloat(m[1].replace(/,/g,''));break}}
if(!o.amt){var a=t.replace(/ค่าธรรมเนียม\s*[0-9,.]+/g,'').match(/([0-9][0-9,]*\.[0-9]{2})/);if(a)o.amt=parseFloat(a[1].replace(/,/g,''))}
var d=t.match(/(\d{1,2})\s*(ม\.ค|ก\.พ|มี\.ค|เม\.ย|พ\.ค|มิ\.ย|ก\.ค|ส\.ค|ก\.ย|ต\.ค|พ\.ย|ธ\.ค)\.?\s*(\d{2,4})/);
if(d){var y=+d[3];y=y<100?y+2500:y;y=y>2400?y-543:y;o.date=y+'-'+String(MN[d[2]]).padStart(2,'0')+'-'+String(+d[1]).padStart(2,'0')}
var nm=L.filter(function(x){return /^[^ก-ฮA-Za-z]{0,3}\s*(นาย|นาง|นางสาว|น\.ส\.|ด\.ช\.|ด\.ญ\.)/.test(x)});
var mi=-1;L.forEach(function(x,i){if(/^\(?\d{10,}\)?$/.test(x))mi=i});
if(mi>0&&/[A-Za-zก-ฮ]/.test(L[mi-1])&&!/ธรรมเนียม/.test(L[mi-1]))o.who=L[mi-1];else if(nm.length>1)o.who=nm[1];
if(o.who)o.who=o.who.replace(/^[^ก-ฮA-Za-z0-9]+/,'').trim();
o.bill=/จ่ายบิล/.test(t);return o}
